# Résolveur DNS interne de Docker.
#
# Sans lui, nginx résout `web` UNE SEULE FOIS, au démarrage, et garde l'IP pour la
# vie du process. Chaque recréation du conteneur `web` — donc chaque deploy — lui
# donne une nouvelle IP, et nginx continuait de taper l'ancienne : 502 jusqu'à ce
# que nginx soit lui-même recréé (issue #449 ; log révélateur :
# `upstream: "http://127.0.53.53:8000"`, la sentinelle NXDOMAIN figée au boot).
#
# Il faut les deux : ce `resolver` ET un `proxy_pass` sur variable — un
# `proxy_pass http://web:8000` littéral reste résolu au chargement de la config,
# resolver ou pas. Régression : `nginx/test-resilience.sh`.
#
# `valid=5s` n'est pas décoratif, et ce n'est pas non plus zéro : le DNS interne de
# Docker annonce un TTL de 600 s, que nginx respecterait. C'est donc cette valeur
# qui **borne** la bascule — après une recréation de `web`, nginx peut viser
# l'ancienne IP jusqu'à 5 s, page de maintenance à l'appui, puis converge seul. La
# baisser encore ne coûterait qu'une requête DNS locale de plus, mais 5 s tient
# déjà dans le temps de démarrage de gunicorn.
resolver 127.0.0.11 ipv6=off valid=5s;
resolver_timeout 5s;

server {
    listen 80;

    # Cache la version nginx dans les headers et pages d'erreur
    server_tokens off;

    # Compression gzip — assets statiques uniquement (pas l'API)
    #
    # `text/javascript` autant qu'`application/javascript` : c'est le type que
    # `mimetypes` retient depuis Python 3.12, donc celui que Django met sur les
    # `.js`. Avec la seule forme `application/…`, le CSS sortait gzippé et le
    # bundle React partait **brut** — 824 Ko à chaque visite froide (issue #452).
    #
    # `gzip_comp_level 5` : le défaut nginx est 1. Mesuré sur le bundle réel,
    # 824 Ko → 304 Ko en niveau 1, → 257 Ko en niveau 5, et le niveau 9 ne rend
    # que 2 Ko de plus pour bien plus de CPU. 5 est le point d'arrêt.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;

    # Taille max des uploads (avatars, documents)
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # Amont Django, en variable pour forcer la ré-résolution DNS (voir plus haut).
    set $django web:8000;

    # Réglages de proxy communs aux locations ci-dessous — hérités, donc écrits une
    # seule fois. `proxy_connect_timeout` est court exprès : pendant le boot du
    # conteneur, mieux vaut la page de maintenance en 3 s qu'une minute de page
    # blanche.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Préserve le header positionné par Traefik (https)
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;

    # Bloque les fichiers sensibles (bots qui scannent)
    location ~ /\.(env|git|htaccess|htpasswd|DS_Store) {
        return 404;
    }

    # L'API répond du JSON même indisponible : l'intercepteur axios de la SPA lit
    # `detail`, et du HTML lui vaudrait une erreur de parsing en place du motif.
    location /api/ {
        proxy_pass http://$django;
        error_page 502 503 504 =503 @unavailable_api;
    }

    # Les media files passent par Django pour vérification des droits.
    # Django répond avec X-Accel-Redirect et Nginx sert depuis /_protected_media/.
    location /media/ {
        proxy_pass http://$django;
        error_page 502 503 504 =503 @unavailable;
    }

    # Location interne : uniquement accessible via X-Accel-Redirect, jamais directement.
    location /_protected_media/ {
        internal;
        alias /app/media/;
    }

    # Proxifie tout le reste vers Gunicorn
    location / {
        proxy_pass http://$django;
        error_page 502 503 504 =503 @unavailable;
    }

    # Page de maintenance — ce que voit un humain quand Django ne répond pas
    # (redéploiement, le plus souvent). Elle se recharge d'elle-même dès que
    # `/health/` répond : plus de 502 brut à recharger à la main.
    #
    # `=503` : sans lui la page partirait en 200 (le statut de la page servie) ou
    # en 502 (celui de l'amont). 502 « Bad Gateway » accuse un amont cassé ; 503
    # « momentanément indisponible » dit la vérité et porte un `Retry-After`.
    #
    # Les `add_header` de ce bloc annulent l'héritage de ceux du `server` : la page
    # part donc sans les en-têtes de sécurité. Assumé — elle est statique, sans
    # formulaire, sans contenu utilisateur, sans ressource externe.
    location @unavailable {
        root /usr/share/nginx/html;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        try_files /maintenance.html =503;
    }

    location @unavailable_api {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail": "Maisonnée est momentanément indisponible. Une mise à jour est probablement en cours, réessayez dans quelques secondes."}';
    }
}
