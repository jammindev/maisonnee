# L'instance de démonstration publique — https://demo.maisonnee.jammin-dev.com
#
# Une **vitrine**, pas un produit. Elle ne garde personne : elle existe pour
# qu'un visiteur clique trois minutes dans un foyer rempli, comprenne ce que
# l'app fait, le montre à son foyer — puis aille l'installer chez lui. Aucune
# donnée réelle n'y vit, et tout est effacé chaque nuit.
#
# Ce fichier n'est **pas** `docker-compose.yml` (celui de l'auto-hébergeur, qui
# doit marcher sans rien lire) ni `docker-compose.prod.yml` (l'instance réelle de
# l'auteur). Trois fichiers, trois jeux d'hypothèses ; les fusionner ferait porter
# à chacun les compromis des deux autres.
#
# Déploiement : voir DEPLOYMENT.md § 11.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Migrations + première seed, sur un conteneur jetable. Le `web` ne démarre
  # qu'après : on migre avant de basculer, comme en production.
  init:
    image: ${MAISONNEE_IMAGE:-ghcr.io/jammindev/maisonnee:latest}
    restart: "no"
    env_file: .env
    environment:
      # ⚠️ Éteint pendant la seed. Les embeddings sont posés par un signal
      # `post_save` : 650 lignes semées = 650 appels unitaires au fournisseur.
      # `backfill_embeddings` les bat en lots juste après, pour une fraction du
      # coût et du temps.
      EMBEDDING_INDEXING_ENABLED: "0"
    depends_on:
      db:
        condition: service_healthy
    # ⚠️ L'indexation sémantique est **conditionnelle**, et `web` en dépend.
    # `get_embedding_client()` lève si `VOYAGE_API_KEY` est vide, et cet appel est
    # hors du try/except de la commande : sans cette garde, `init` échoue, et comme
    # `web` attend qu'il réussisse, l'instance entière ne démarre pas — pour une
    # clé facultative. Une capacité absente se déclare, elle ne fait pas tomber ce
    # qui n'en dépend pas.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo_data --flush --password $${DEMO_PASSWORD} &&
             if [ -n \"$${VOYAGE_API_KEY}\" ]; then
               python manage.py backfill_embeddings;
             else
               echo 'VOYAGE_API_KEY absente : indexation semantique ignoree, la recherche garde sa jambe lexicale';
             fi"
    networks:
      - internal

  web:
    image: ${MAISONNEE_IMAGE:-ghcr.io/jammindev/maisonnee:latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      init:
        condition: service_completed_successfully
    # Sans healthcheck, le `--wait` de `reset.sh` n'attend que « le conteneur est
    # lancé » — ce qui est vrai avant que gunicorn n'accepte une connexion. La
    # remise à zéro enchaînerait alors un `exec` sur un process qui démarre encore.
    # `/health/` reste une preuve de vie et ne touche pas la base (cf. CLAUDE.md).
    #
    # ⚠️ **La sonde DOIT présenter l'en-tête `Host` du domaine.** Sans lui la requête
    # part avec `Host: 127.0.0.1:8000`, que `ALLOWED_HOSTS` refuse en **400
    # DisallowedHost** : l'application va parfaitement bien, mais elle décline la
    # sonde au nom de sa propre sécurité. Le conteneur passe `unhealthy`, et deux
    # choses tombent d'un coup :
    #
    #   1. **Traefik ignore les conteneurs `unhealthy`** — le routeur quitte sa table
    #      et la vitrine publique répond 404. C'est le 404 de Traefik, pas celui de
    #      l'app : `text/plain`, 19 octets, routeur `"-"` dans son log d'accès.
    #   2. Le `up -d --wait` de `reset.sh` abandonne (`container demo-web-1 is
    #      unhealthy`), donc la remise à zéro nocturne échoue elle aussi.
    #
    # Vécu en production : injoignable **et** plus resemée pendant douze jours. Le
    # piège est qu'un healthcheck fautif ne mord qu'à la **recréation** du
    # conteneur — il dort donc jusqu'au deploy suivant, longtemps après la revue.
    # Régression : `apps/core/tests/test_demo_healthcheck.py`.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/', headers={'Host': '${DOMAIN}'}), timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public

      # 8000, et pas 80 : cette image sert **gunicorn directement**, sans nginx
      # devant. Le patron Traefik du VPS annonce 80 parce que les autres apps y
      # mettent un nginx ; le recopier ici donne un 502 sur un conteneur pourtant
      # sain — Traefik joint le bon conteneur sur un port où personne n'écoute.
      - traefik.http.services.${STACK_NAME}-web.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME}-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME}-http.middlewares=https-redirect

      - traefik.http.routers.${STACK_NAME}-https.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME}-https.tls=true
      - traefik.http.routers.${STACK_NAME}-https.tls.certresolver=le

volumes:
  demo-postgres-data:

networks:
  internal:
  traefik-public:
    external: true
