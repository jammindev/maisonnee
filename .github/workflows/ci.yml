name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # postgres:16 + pgvector extension (parcours 21). The migration
        # apps/agent/0008 runs CREATE EXTENSION vector during test DB setup.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: house_test
          POSTGRES_USER: house_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://house_user:test_password@localhost:5432/house_test
      # Une seule définition du nombre de workers : l'étape qui crée les bases et
      # celle qui lance pytest doivent toujours parler du même chiffre.
      PYTEST_WORKERS: 2

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/test.txt

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      # La suite tourne en parallèle (`-n`), donc sur une base par worker :
      # pytest-django suffixe `TEST['NAME']` (→ `house_test_gw0`, `house_test_gw1`).
      #
      # On les crée ici plutôt que de laisser Django le faire, et c'est le point à
      # ne pas défaire : un `CREATE DATABASE` sans template explicite clone
      # `template1`, or conftest.py y ouvre une connexion pour poser l'extension
      # `vector` (contrepartie de --nomigrations, voir sa docstring). Postgres
      # refuse de cloner une base à laquelle une autre session est connectée — deux
      # workers qui démarrent ensemble, c'est un rouge intermittent, le genre qui
      # coûte plus cher que les secondes gagnées. Bases pré-créées, `--reuse-db`
      # (pytest.ini) les réutilise : aucun clone n'a lieu, et le conftest pose
      # l'extension dans chacune par son chemin « la base existe déjà ».
      - name: Create one test database per worker
        run: |
          for i in $(seq 0 $((PYTEST_WORKERS - 1))); do
            psql "$DATABASE_URL" -c "CREATE DATABASE house_test_gw$i"
          done

      - name: Run tests
        run: pytest -n "$PYTEST_WORKERS" --no-cov-on-fail -q

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Les tests unitaires du front n'étaient lancés par personne. C'est là que
      # vit le garde-fou i18n : il compare le code aux quatre catalogues, et
      # c'est le seul contrôle capable d'attraper une clé écrasée — la parité
      # entre langues ne voit rien quand la clé manque partout.
      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  # Le reverse-proxy est la seule pièce dont une faute de frappe met la prod par
  # terre sans qu'aucun test ne l'ait vue : le conf n'était jamais chargé avant
  # d'être en production. Ce job le charge pour de vrai (`nginx -t`) et vérifie
  # les trois propriétés qui font qu'un deploy ne montre pas un 502 (issue #449).
  proxy:
    name: Reverse-proxy resilience
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test de résilience nginx
        run: ./nginx/test-resilience.sh

  # Une sauvegarde jamais restaurée n'est pas une sauvegarde. Ce job rejoue le
  # cycle complet sur une base neuve à chaque PR — voir `backup-restore.yml`.
  #
  # ⚠️ Il ne garde PAS le deploy, et c'est délibéré : la prod de l'auteur a ses
  # sauvegardes et son historique, et bloquer une correction urgente sur un round
  # trip de restauration ferait payer à la production un risque qui pèse sur les
  # instances tierces. C'est `release.yml` qui le rend bloquant, là où il compte
  # — au moment où on distribue une image que des inconnus installeront.
  backup:
    name: Backup & restore
    uses: ./.github/workflows/backup-restore.yml

  deploy:
    name: Deploy to Production
    # ⚠️ SEUL job de ce dépôt PUBIC à tourner sur le runner self-hosted, donc sur
    # le VPS. Les trois autres sont sur `ubuntu-latest` : du code venu d'une PR de
    # fork ne touche jamais la machine.
    #
    # La garde ci-dessous est ce qui rend ça vrai, et chacune de ses trois
    # conditions compte :
    #   - `event_name == 'push'`    → une PR (y compris de fork) est un
    #                                 `pull_request` : le job est sauté, le runner
    #                                 ne prend jamais le job ;
    #   - `ref == refs/heads/main`  → une branche poussée directement ne déploie pas ;
    #   - `repository == …`         → un fork qui hérite du workflow ne peut pas
    #                                 réquisitionner le runner s'il s'en enregistrait un.
    #
    # Corollaire à ne jamais perdre de vue : ce job donne un shell sur le VPS à
    # quiconque peut pousser sur `main`. Les contributions extérieures passent par
    # fork + PR, jamais par un accès write. Voir le lot 0 du parcours 28.
    runs-on: self-hosted
    needs: [backend, frontend, proxy]
    if: >-
      github.repository == 'jammindev/maisonnee' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    env:
      COMPOSE: /usr/local/bin/docker compose -f docker-compose.prod.yml

    steps:
      - name: Pull latest code
        run: |
          cd ~/jammin-dev/apps/house
          git fetch origin main
          git reset --hard origin/main

      - name: Build the new image
        run: |
          cd ~/jammin-dev/apps/house
          $COMPOSE build web

      # `--no-deps` partout dans ce job, et c'est le cœur du correctif : sans lui,
      # compose recrée nginx dans la foulée de web, donc le proxy tombe pendant
      # l'opération et sa page de maintenance ne sert à rien. nginx reste debout et
      # ré-résout `web` tout seul (voir nginx/conf.d/default.conf).
      - name: Ensure db & nginx are up
        run: |
          cd ~/jammin-dev/apps/house
          $COMPOSE up -d --no-deps db nginx

      # Migrer AVANT de basculer le trafic, sur un conteneur jetable de l'image
      # neuve. L'ordre inverse — basculer puis migrer — laissait le code neuf
      # servir quelques secondes sur l'ancien schéma, donc des 500 sur toute
      # colonne fraîchement ajoutée.
      #
      # Contrepartie assumée, et c'est la moins chère des deux : l'ancien code voit
      # le nouveau schéma le temps du basculement. Une migration additive lui est
      # transparente ; une migration destructive (colonne supprimée ou renommée)
      # doit donc être livrée en deux fois.
      - name: Run migrations (before the swap)
        run: |
          cd ~/jammin-dev/apps/house
          $COMPOSE run --rm --no-deps web python manage.py migrate

      # `--wait` s'appuie sur le healthcheck de `web` (GET /health/) : le job ne
      # continue que quand gunicorn accepte vraiment des connexions, et échoue
      # bruyamment si le conteneur neuf ne démarre pas — au lieu de laisser la prod
      # sur la page de maintenance sans que personne ne soit prévenu.
      - name: Swap web & schedulers
        run: |
          cd ~/jammin-dev/apps/house
          $COMPOSE up -d --no-deps --wait --wait-timeout 180 web scheduler scheduler-briefings

      # nginx n'est pas recréé (voir plus haut) : un changement de default.conf ne
      # serait donc jamais pris en compte. `nginx -t` d'abord — un conf invalide
      # fait échouer l'étape sans toucher au process, qui garde l'ancien.
      - name: Reload nginx config
        run: |
          cd ~/jammin-dev/apps/house
          $COMPOSE exec -T nginx nginx -t
          $COMPOSE exec -T nginx nginx -s reload

      # Pousse le menu de commandes du bot (/ autocomplete, BOT_COMMANDS).
      # Idempotent, skip propre si le canal Telegram est off. continue-on-error :
      # un hoquet Telegram ne doit jamais bloquer le deploy.
      - name: Sync Telegram commands
        continue-on-error: true
        run: |
          cd ~/jammin-dev/apps/house
          $COMPOSE exec -T web python manage.py telegram_set_commands

      # Alimente la page « Nouveautés » (/app/changelog). Le conteneur n'a pas le
      # .git (exclu par .dockerignore) : le runner, lui, l'a → on pipe le git log
      # via stdin. continue-on-error : un échec ici ne doit jamais bloquer le deploy.
      - name: Generate changelog
        continue-on-error: true
        run: |
          cd ~/jammin-dev/apps/house
          git log --pretty=format:'%H%x1f%cI%x1f%s%x1e' | \
            $COMPOSE exec -T web python manage.py generate_changelog --from-stdin
