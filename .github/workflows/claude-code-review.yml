# ⚠️ DÉSACTIVÉ le 2026-07-27 — ne pas rebrancher sans corriger les deux causes ci-dessous.
#
# Ce workflow a tourné sur les PR #413 → #417 sans jamais publier une seule ligne :
# zéro review, zéro commentaire, zéro commentaire inline (vérifié par l'API). Chaque run
# vert finissait sur « No buffered inline comments », avec 1, 10 puis 42 refus de
# permission — la revue était produite, puis jetée. Coût : ~8,5 $ de quota d'abonnement
# (token OAuth, pas de crédits API) pour rien.
#
# Deux causes, indépendantes, à corriger AVANT de réactiver :
#   1. Le job était déclaré en lecture seule (`pull-requests: read`, `issues: read`).
#      Il faut `pull-requests: write` + `issues: write` pour publier une revue.
#   2. En mode `prompt` (automation), l'action ne poste pas son résultat par défaut :
#      il faut `track_progress: true` (ou `use_sticky_comment`), sinon le rapport final
#      n'a aucun canal de sortie. Le `ReportFindings` du plugin `code-review` écrit pour
#      une UI hôte qui n'existe pas dans un runner.
#
# Pour diagnostiquer un futur run : `show_full_output: true` (l'action masque la sortie
# du SDK par défaut, ce qui rend les refus de permission invisibles).
#
# En attendant, la revue est un passage manuel dans le skill `/ship` (`/review <pr>`).
# Le déclencheur `pull_request` est volontairement retiré pour que la décision survive
# à un `gh workflow enable` — le workflow est aussi désactivé côté GitHub.

name: Claude Code Review

on:
  # `workflow_dispatch` n'est déclenchable que par un compte ayant les droits
  # d'écriture : sur un dépôt public, ce workflow n'est donc pas atteignable de
  # l'extérieur en l'état.
  workflow_dispatch:
  # Déclencheur d'origine, à restaurer une fois les deux causes corrigées :
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]
  #
  # ⚠️ DÉPÔT PUBLIC — en le restaurant, ajouter la même garde que `claude.yml` :
  # une PR ouverte depuis un fork consommerait sinon le quota Claude du
  # mainteneur à chaque push de son auteur. Filtrer sur
  # `github.event.pull_request.author_association` ∈ {OWNER, MEMBER, COLLABORATOR}.

jobs:
  claude-review:
    if: github.repository == 'jammindev/maisonnee'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ⚠️ `read` ici = cause n°1 : passer les deux à `write` avant de réactiver.
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # ⚠️ cause n°2 : sans `track_progress: true`, ce prompt ne publie rien.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
